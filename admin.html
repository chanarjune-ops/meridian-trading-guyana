<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meridian Trading Admin</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#111}.head{background:#06438c;color:#fff;padding:20px 6%;display:flex;align-items:center;gap:15px}.head img{width:70px;height:50px;object-fit:cover}.wrap{padding:25px 6%;max-width:1200px;margin:auto}.panel{background:#fff;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0001}input,select{padding:11px;margin:5px;border:1px solid #ccc;border-radius:6px}.pricebox{display:flex;align-items:center;gap:5px}.pricebox input{width:150px;margin:0}.saveprice{background:#0b8f4d;padding:8px 10px;font-size:12px}.saved{color:#0b8f4d;font-size:12px;font-weight:bold}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.hint{background:#fff8d6;border:1px solid #f1df82;padding:10px 12px;border-radius:8px;margin-bottom:12px}button{padding:11px 16px;border:0;border-radius:6px;background:#075bd0;color:#fff;font-weight:bold;cursor:pointer}.danger{background:#d22}.muted{color:#555}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.login{max-width:420px;margin:60px auto}.hide{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.head{padding:15px}.wrap{padding:15px}}</style></head><body><div class="head"><img src="assets/logo.jpeg"><div><h2>Meridian Trading Admin</h2><small>Manage products, stock, prices and orders</small></div></div><div class="wrap"><div id="login" class="panel login"><h2>Admin Login</h2><input id="user" placeholder="Username" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Sign in</button><p class="muted">Use the credentials configured on your server.</p></div><div id="app" class="hide"><div class="panel"><h2>Add Product</h2><input id="name" placeholder="Product name"><input id="price" type="number" placeholder="Price GYD"><input id="old" type="number" placeholder="Old price"><input id="stock" type="number" placeholder="Stock"><select id="cat"><option>Laptops</option><option>Phones</option><option>Accessories</option><option>Headphones</option><option>Electronics</option></select><input id="img" placeholder="Image path, e.g. assets/laptop.jpeg"><label><input id="deal" type="checkbox"> Daily Deal</label><button onclick="addProduct()">Save Product</button></div><div class="panel"><div class="toolbar"><h2>Products</h2><button onclick="refresh()">↻ Refresh</button></div><div class="hint">💰 <b>Quick price edit:</b> change the GYD price and tap <b>Save Price</b>. The new price appears on the customer website immediately.</div><div id="products"></div></div><div class="panel"><h2>Orders</h2><div id="orders"></div></div></div></div><script>
let T='';const $=id=>document.getElementById(id);async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});let d=await r.json();if(!r.ok)return alert(d.error);T=d.token;sessionStorage.setItem('mt',T);$('login').classList.add('hide');$('app').classList.remove('hide');refresh()}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+T,'Content-Type':'application/json'};let r=await fetch(path,opt);let d=r.status===204?null:await r.json();if(!r.ok)throw Error(d?.error||'Request failed');return d}
async function refresh(){let ps=await api('/api/admin/products'),os=await api('/api/admin/orders');$('products').innerHTML=ps.map(p=>`<div class="row"><div><b>${p.name}</b><br><small>${p.cat}</small></div><div class="pricebox"><input id="price-${p.id}" type="number" min="0" step="1" value="${p.price}"><button class="saveprice" onclick="savePrice(${p.id})">Save Price</button></div><div><input id="stock-${p.id}" type="number" min="0" value="${p.stock}" style="width:90px" onchange="edit(${p.id},'stock',this.value)"></div><label><input type="checkbox" ${p.active?'checked':''} onchange="edit(${p.id},'active',this.checked)"> Live</label><button class="danger" onclick="del(${p.id})">Delete</button></div>`).join('');$('orders').innerHTML=os.length?os.map(o=>`<div class="row"><div><b>${o.id}</b><br>${o.customer.name} • ${o.customer.phone}<br>${o.payment} • ${o.total.toLocaleString()} GYD</div><select onchange="status('${o.id}',this.value)">${['New','Payment Pending','Paid','Preparing','Out for Delivery','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><div>${o.customer.address}</div></div>`).join(''):'<p>No orders yet.</p>'}
async function addProduct(){await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:$('name').value,price:+$('price').value,old:+$('old').value,stock:+$('stock').value,cat:$('cat').value,img:$('img').value,deal:$('deal').checked})});alert('Product saved');refresh()}
async function edit(id,k,v){await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({[k]:k==='price'||k==='stock'?+v:v})})}
async function savePrice(id){let input=$('price-'+id);let price=Number(input.value);if(!Number.isFinite(price)||price<0)return alert('Enter a valid GYD price.');await edit(id,'price',price);alert('Price updated to GYD $'+price.toLocaleString());refresh()}
async function del(id){if(confirm('Delete this product?')){await api('/api/admin/products/'+id,{method:'DELETE'});refresh()}}
async function status(id,v){await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status:v})});refresh()}
T=sessionStorage.getItem('mt')||'';if(T){$('login').classList.add('hide');$('app').classList.remove('hide');refresh()}
</script></body></html>
